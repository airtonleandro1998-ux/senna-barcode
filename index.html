<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151515">
  <title>SENNA BARCODE</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --red: #e31b23;
      --bg: #101010;
      --panel: #1b1b1b;
      --panel2: #242424;
      --text: #f5f5f5;
      --muted: #aaa;
      --green: #27c46b;
      --yellow: #ffc247;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 15px 0 25px;
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      color: var(--red);
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 3px;
      margin-top: 7px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid #333;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 16px;
      margin: 0 0 15px;
    }

    .local-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .local-btn {
      color: white;
      background: #333;
      border: 1px solid #555;
    }

    .local-btn.active {
      background: var(--red);
      border-color: var(--red);
    }

    .selected-local {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 9px;
      border: 1px solid #444;
      background: #101010;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 10px;
    }

    input:focus {
      border-color: var(--red);
    }

    .primary-btn {
      width: 100%;
      background: var(--red);
      color: white;
    }

    .secondary-btn {
      width: 100%;
      background: #333;
      color: white;
      margin-top: 10px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    .status {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    .result-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price {
      color: var(--green);
      font-size: 25px;
      font-weight: bold;
      margin: 15px 0;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .detail {
      background: var(--panel2);
      padding: 12px;
      border-radius: 9px;
    }

    .detail small {
      display: block;
      color: var(--muted);
      margin-bottom: 7px;
      font-size: 11px;
    }

    .detail strong {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .stock-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .stock {
      background: #111;
      border: 1px solid #333;
      border-radius: 9px;
      padding: 13px;
      text-align: center;
    }

    .stock small {
      color: var(--muted);
      display: block;
      margin-bottom: 8px;
    }

    .stock strong {
      font-size: 25px;
    }

    .total-stock {
      background: #302020;
      border: 1px solid #633;
      border-radius: 9px;
      padding: 14px;
      text-align: center;
      margin-top: 10px;
    }

    .total-stock small {
      display: block;
      color: #ddd;
      margin-bottom: 5px;
    }

    .total-stock strong {
      color: var(--yellow);
      font-size: 25px;
    }

    .message {
      text-align: center;
      padding: 14px;
      border-radius: 9px;
      background: #292929;
      color: var(--muted);
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ff7777;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 11px;
      padding: 15px;
    }

    @media (max-width: 420px) {
      body {
        padding: 12px;
      }

      .panel {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="logo">SENNA <span>BARCODE</span></div>
      <div class="subtitle">SENNA PERFORMANCE</div>
    </header>

    <section class="panel">
      <h2>Seleccionar local</h2>

      <div class="local-buttons">
        <button
          id="btnLosAndes"
          class="local-btn"
          onclick="seleccionarLocal('LOS ANDES')">
          LOS ANDES
        </button>

        <button
          id="btnSantiago"
          class="local-btn"
          onclick="seleccionarLocal('SANTIAGO')">
          SANTIAGO
        </button>
      </div>

      <div class="selected-local" id="localActual">
        Selecciona el local para comenzar.
      </div>
    </section>

    <section class="panel">
      <h2>Buscar producto</h2>

      <input
        type="text"
        id="codigo"
        placeholder="Ingresa código de barras o SKU"
        autocomplete="off"
        onkeydown="if(event.key === 'Enter') buscarProducto()">

      <button class="primary-btn" onclick="buscarProducto()">
        BUSCAR PRODUCTO
      </button>
    </section>

    <section class="panel">
      <h2>Escanear código de barras</h2>

      <div id="reader"></div>

      <button
        id="btnCamara"
        class="secondary-btn"
        onclick="iniciarCamara()">
        ACTIVAR CÁMARA
      </button>

      <button
        id="btnDetener"
        class="secondary-btn hidden"
        onclick="detenerCamara()">
        DETENER CÁMARA
      </button>

      <div class="status" id="estadoCamara">
        Presiona activar cámara para escanear un producto.
      </div>
    </section>

    <section id="resultado" class="panel hidden">
      <h2>Resultado de búsqueda</h2>

      <div id="contenidoResultado"></div>
    </section>

    <div class="footer">
      SENNA PERFORMANCE · SISTEMA DE INVENTARIO
    </div>

  </main>

  <script>
    /**************************************************
     * CONFIGURACIÓN DE API
     **************************************************/

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzTw4X9m-sT10Rb5SDXVbzlhZjZmZnfIlsMogYhYV3TmdvWPOQCewb77lWCubOz_aHG/exec";

    let localSeleccionado = localStorage.getItem("senna_local") || "";
    let lector = null;
    let camaraActiva = false;
    let buscando = false;

    /**************************************************
     * INICIO
     **************************************************/

    document.addEventListener("DOMContentLoaded", function() {
      if (
        localSeleccionado !== "LOS ANDES" &&
        localSeleccionado !== "SANTIAGO"
      ) {
        localSeleccionado = "";
      }

      actualizarLocal();
    });

    /**************************************************
     * SELECCIÓN DE LOCAL
     **************************************************/

    function seleccionarLocal(local) {
      if (!["LOS ANDES", "SANTIAGO"].includes(local)) {
        return;
      }

      localSeleccionado = local;
      localStorage.setItem("senna_local", local);

      actualizarLocal();

      document.getElementById("resultado").classList.add("hidden");
      document.getElementById("codigo").focus();
    }

    function actualizarLocal() {
      const btnLA = document.getElementById("btnLosAndes");
      const btnST = document.getElementById("btnSantiago");
      const texto = document.getElementById("localActual");

      btnLA.classList.toggle(
        "active",
        localSeleccionado === "LOS ANDES"
      );

      btnST.classList.toggle(
        "active",
        localSeleccionado === "SANTIAGO"
      );

      texto.textContent = localSeleccionado
        ? "Local seleccionado: " + localSeleccionado
        : "Selecciona el local para comenzar.";
    }

    /**************************************************
     * COMUNICACIÓN CON GOOGLE APPS SCRIPT
     * Utiliza JSONP para GitHub Pages.
     **************************************************/

    function llamarAPI(parametros) {
      return new Promise((resolve, reject) => {
        const callback = "sennaCallback_" +
          Date.now() + "_" +
          Math.floor(Math.random() * 100000);

        const script = document.createElement("script");

        const timeout = setTimeout(() => {
          limpiar();
          reject(new Error(
            "Tiempo de espera agotado. Revisa la conexión con Apps Script."
          ));
        }, 20000);

        function limpiar() {
          clearTimeout(timeout);
          delete window[callback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callback] = function(data) {
          limpiar();
          resolve(data);
        };

        const query = new URLSearchParams({
          ...parametros,
          callback: callback
        });

        script.src = API_URL + "?" + query.toString();

        script.onerror = function() {
          limpiar();
          reject(new Error(
            "No fue posible conectar con el servidor."
          ));
        };

        document.body.appendChild(script);
      });
    }

    /**************************************************
     * BÚSQUEDA DE PRODUCTOS
     **************************************************/

    async function buscarProducto(codigoEscaneado) {
      if (buscando) return;

      if (!localSeleccionado) {
        mostrarMensaje("Selecciona primero Los Andes o Santiago.", true);
        return;
      }

      const codigo = String(
        codigoEscaneado ||
        document.getElementById("codigo").value ||
        ""
      ).trim();

      if (!codigo) {
        mostrarMensaje("Ingresa un código de barras o SKU.", true);
        return;
      }

      buscando = true;
      mostrarMensaje("Buscando producto...");

      try {
        const respuesta = await llamarAPI({
          action: "buscar",
          codigo: codigo,
          local: localSeleccionado
        });

        if (!respuesta) {
          throw new Error("El servidor no entregó una respuesta.");
        }

        if (respuesta.error) {
          mostrarMensaje(
            respuesta.mensaje || "No se pudo realizar la búsqueda.",
            true
          );
          return;
        }

        if (!respuesta.producto) {
          mostrarMensaje("No se encontró ningún producto.", true);
          return;
        }

        mostrarProducto(respuesta);

      } catch (error) {
        mostrarMensaje(error.message, true);
      } finally {
        buscando = false;
      }
    }

    /**************************************************
     * MOSTRAR RESULTADO
     **************************************************/

    function escaparHTML(valor) {
      return String(valor ?? "").replace(/[&<>"']/g, function(c) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[c];
      });
    }

    function formatoPesos(valor) {
      return "$" + Number(valor || 0).toLocaleString("es-CL");
    }

    function mostrarProducto(p) {
      const resultado = document.getElementById("resultado");
      const contenido = document.getElementById("contenidoResultado");

      contenido.innerHTML = `
        <div class="result-title">
          ${escaparHTML(p.producto)}
        </div>

        <div class="price">
          ${formatoPesos(p.precio)}
        </div>

        <div class="details">
          <div class="detail">
            <small>SKU</small>
            <strong>${escaparHTML(p.sku)}</strong>
          </div>

          <div class="detail">
            <small>CÓDIGO DE BARRAS</small>
            <strong>${escaparHTML(p.codigo)}</strong>
          </div>

          <div class="detail">
            <small>MARCA</small>
            <strong>${escaparHTML(p.marca)}</strong>
          </div>

          <div class="detail">
            <small>CATEGORÍA</small>
            <strong>${escaparHTML(p.categoria)}</strong>
          </div>
        </div>

        <h2 style="margin-top:22px;">Stock por local</h2>

        <div class="stock-box">
          <div class="stock">
            <small>LOS ANDES</small>
            <strong>${Number(p.stockLosAndes || 0)}</strong>
          </div>

          <div class="stock">
            <small>SANTIAGO</small>
            <strong>${Number(p.stockSantiago || 0)}</strong>
          </div>
        </div>

        <div class="total-stock">
          <small>STOCK TOTAL</small>
          <strong>${Number(p.stockTotal || 0)}</strong>
        </div>

        <div class="message">
          Stock en ${escaparHTML(p.local)}:
          <strong>${Number(p.stock || 0)} unidades</strong>
        </div>
      `;

      resultado.classList.remove("hidden");
      resultado.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function mostrarMensaje(mensaje, esError) {
      const resultado = document.getElementById("resultado");
      const contenido = document.getElementById("contenidoResultado");

      resultado.classList.remove("hidden");

      contenido.innerHTML = `
        <div class="message ${esError ? "error" : ""}">
          ${escaparHTML(mensaje)}
        </div>
      `;
    }

    /**************************************************
     * LECTOR DE CÓDIGOS
     **************************************************/

    async function iniciarCamara() {
      if (!localSeleccionado) {
        mostrarMensaje("Selecciona primero el local.", true);
        return;
      }

      if (camaraActiva) return;

      try {
        lector = new Html5Qrcode("reader");

        const configuracion = {
          fps: 10,
          qrbox: {
            width: 280,
            height: 140
          },
          aspectRatio: 1.5
        };

        await lector.start(
          { facingMode: "environment" },
          configuracion,
          async function(codigo) {
            if (!codigo || buscando) return;

            document.getElementById("codigo").value = codigo;

            await detenerCamara();
            await buscarProducto(codigo);
          }
        );

        camaraActiva = true;

        document.getElementById("btnCamara")
          .classList.add("hidden");

        document.getElementById("btnDetener")
          .classList.remove("hidden");

        document.getElementById("estadoCamara").textContent =
          "Cámara activa. Apunta al código de barras.";

      } catch (error) {
        document.getElementById("estadoCamara").textContent =
          "No se pudo activar la cámara. Verifica los permisos del navegador.";
      }
    }

    async function detenerCamara() {
      if (!lector || !camaraActiva) return;

      try {
        await lector.stop();
        await lector.clear();
      } catch (error) {
        console.log("No se pudo detener la cámara:", error);
      }

      camaraActiva = false;
      lector = null;

      document.getElementById("btnCamara")
        .classList.remove("hidden");

      document.getElementById("btnDetener")
        .classList.add("hidden");

      document.getElementById("estadoCamara").textContent =
        "Cámara detenida.";
    }
  </script>
</body>
</html>
