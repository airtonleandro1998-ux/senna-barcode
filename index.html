
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SENNA BARCODE</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }

    .app {
      max-width: 450px;
      margin: auto;
      text-align: center;
    }

    h1 span { color: #e53935; }

    button {
      background: #e53935;
      color: white;
      border: none;
      padding: 16px;
      width: 100%;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    #reader {
      margin-top: 20px;
      width: 100%;
    }

    #resultado {
      background: #292929;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: left;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>SENNA <span>PERFORMANCE</span></h1>
    <p>BARCODE SCANNER</p>

    <button onclick="iniciar()">ESCANEAR PRODUCTO</button>

    <div id="reader"></div>

    <p id="estado">Esperando escaneo...</p>

    <div id="resultado">
      La información aparecerá aquí.
    </div>
  </div>

  <script>
    let scanner;
    let ocupado = false;

    async function iniciar() {
      if (scanner) return;

      ocupado = false;
      document.getElementById("estado").textContent =
        "Iniciando cámara...";

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 120 }
          },
          async (codigo) => {
            if (ocupado) return;
            ocupado = true;

            document.getElementById("estado").textContent =
              "Código detectado";

            document.getElementById("resultado").textContent =
              "Código leído: " + codigo;

            await scanner.stop();
            scanner = null;
          },
          () => {}
        );
      } catch (error) {
        document.getElementById("estado").textContent =
          "Error de cámara: " + error;
        scanner = null;
      }
    }
  </script>
</body>
</html>
